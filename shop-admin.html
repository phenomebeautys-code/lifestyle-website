<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phenome Beauty - Admin Dashboard</title>
    <link rel="stylesheet" href="shop-admin.css">
</head>
<body>
    <div id="login-screen" class="login-screen">
        <div class="login-container">
            <h1>Phenome Beauty Admin</h1>
            <input type="password" id="admin-password" placeholder="Enter admin password" />
            <button onclick="handleLogin()">Login</button>
            <p id="login-error" class="error"></p>
        </div>
    </div>

    <div id="admin-dashboard" class="dashboard" style="display: none;">
        <nav class="sidebar">
            <div class="logo">Phenome Admin</div>
            <ul class="nav-menu">
                <li><a href="#" class="nav-link active" data-section="dashboard">Dashboard</a></li>
                <li><a href="#" class="nav-link" data-section="orders">Orders</a></li>
                <li><a href="#" class="nav-link" data-section="products">Products</a></li>
                <li><a href="#" class="nav-link" data-section="stock">Stock Management</a></li>
                <li><button onclick="handleLogout()" class="logout-btn">Logout</button></li>
            </ul>
        </nav>

        <main class="main-content">
            <section id="dashboard-section" class="content-section active">
                <h2>Dashboard Overview</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Total Orders</h3>
                        <p id="total-orders">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>Pending Orders</h3>
                        <p id="pending-orders">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>Total Products</h3>
                        <p id="total-products">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>Low Stock Items</h3>
                        <p id="low-stock">0</p>
                    </div>
                </div>
            </section>

            <section id="orders-section" class="content-section">
                <h2>Orders Management</h2>
                <div id="orders-list"></div>
            </section>

            <section id="products-section" class="content-section">
                <h2>Products Management</h2>
                <div id="products-list"></div>
            </section>

            <section id="stock-section" class="content-section">
                <h2>Stock Management</h2>
                <div id="stock-panel"></div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="shop-admin-auth.js"></script>
    <script src="shop-admin-core.js"></script>
    <script src="shop-admin-dashboard.js"></script>
    <script src="shop-admin-orders.js"></script>
    <script src="shop-admin-products.js"></script>
    <script src="stock-management-panel.js"></script>
    <script src="shop-admin.js"></script>
</body>
</html>
