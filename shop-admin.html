<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhenomeBeauty — Shop Admin</title>
  <link rel="stylesheet" href="shop-admin.css" />
</head>
<body>
  <div id="toast"></div>

  <div id="loginPanel">
    <h2>Shop Admin Login</h2>
    <input id="adminPassword" type="password" placeholder="Admin password" />
    <button id="loginBtn">Login</button>
  </div>

  <div id="adminApp" style="display:none;">
    <aside id="sidebar">
      <h3>PhenomeBeauty</h3>
      <nav>
        <button class="nav-btn active" data-page="hub">Hub</button>
        <button class="nav-btn" data-page="orders">Orders</button>
        <button class="nav-btn" data-page="products">Products</button>
        <button class="nav-btn" data-page="stock-management">Stock Management</button>
      </nav>
      <button id="logoutBtn">Logout</button>
    </aside>

    <main id="mainContent">
      <div id="hubContent" class="page-content"></div>
      <div id="ordersContent" class="page-content" style="display:none;"></div>
      <div id="productsContent" class="page-content" style="display:none;"></div>
      <div id="stockManagementContent" class="page-content" style="display:none;"></div>
    </main>
  </div>

  <script src="shop-admin.js"></script>
  <script type="module" src="assets/admin/admin-app.js"></script>
</body>
</html>
